 font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="245.8125" x="76.5591" y="127.6211">Comment: Can I see each owner by name?</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="125.5723" x="76.5591" y="143.7539">Status: accepted &lt;3&gt;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="318.0996" x="76.5591" y="159.8867">Response: each open question names its decider. &lt;4&gt;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="102.8672" x="76.5591" y="176.0195">Changed: FR-013</text><line style="stroke:#AAAAAA;stroke-width:1;" x1="76.5591" x2="410.8989" y1="183.0508" y2="183.0508"/><line style="stroke:#AAAAAA;stroke-width:1;" x1="76.5591" x2="410.8989" y1="185.0508" y2="185.0508"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="298.1777" x="76.5591" y="200.1523">RC-002 about O-002 &#183; R. Hightower &#183; 2026-11-03</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="278.9238" x="76.5591" y="216.2852">Marked: &#8220;to an approval recorded in section 15&#8221;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="257.4668" x="76.5591" y="232.418">Comment: Why days to approval, not hours?</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="98.4961" x="76.5591" y="248.5508">Status: answered</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="306.4336" x="76.5591" y="264.6836">Response: an approval waits on people, not the tool.</text><line style="stroke:#000000;stroke-width:1;" x1="75.5591" x2="410.8989" y1="42.4883" y2="42.4883"/><line style="stroke:#000000;stroke-width:1;" x1="75.5591" x2="410.8989" y1="268.2148" y2="268.2148"/><line style="strok