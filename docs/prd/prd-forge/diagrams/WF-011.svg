<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="SALT" height="363px" preserveAspectRatio="none" style="width:567px;height:363px;background:#FFFFFF;" version="1.1" viewBox="0 0 567 363" width="567px" zoomAndPan="magnify"><title>WF-011 Review comments with their responses in the next exported copy</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="534.6387" x="15" y="28.5352">WF-011 Review comments with their responses in the next exported copy</text></g><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="236.2852" x="118.1494" y="55.0898">prd-forge PRD 0.10.0 &#183; exported copy</text><line style="stroke:#000000;stroke-width:1;" x1="116.1494" x2="116.1494" y1="43.4883" y2="57.6211"/><line style="stroke:#000000;stroke-width:1;" x1="116.1494" x2="357.4346" y1="43.4883" y2="43.4883"/><line style="stroke:#000000;stroke-width:1;" x1="357.4346" x2="357.4346" y1="43.4883" y2="57.6211"/><line style="stroke:#000000;stroke-width:1;" x1="357.4346" x2="367.4346" y1="57.6211" y2="57.6211"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="134.8066" x="116.1494" y="71.2227">Review comments &lt;1&gt;</text><line style="stroke:#AAAAAA;stroke-width:1;" x1="116.1494" x2="450.4893" y1="78.2539" y2="78.2539"/><line style="stroke:#AAAAAA;stroke-width:1;" x1="116.1494" x2="450.4893" y1="80.2539" y2="80.2539"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="333.3398" x="116.1494" y="95.3555">RC-001 about FR-013 &#183; R. Hightower &#183; 2026-11-03 &lt;2&gt;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="247.4707" x="116.1494" y="111.4883">Marked: &#8220;who owns each undecided thing&#8221;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="245.8125" x="116.1494" y="127.6211">Comment: Can I see each owner by name?</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="125.5723" x="116.1494" y="143.7539">Status: accepted &lt;3&gt;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="319.2363" x="116.1494" y="159.8867">Response: each decider is now named, not a role. &lt;4&gt;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="102.8672" x="116.1494" y="176.0195">Changed: FR-013</text><line style="stroke:#AAAAAA;stroke-width:1;" x1="116.1494" x2="450.4893" y1="183.0508" y2="183.0508"/><line style="stroke:#AAAAAA;stroke-width:1;" x1="116.1494" x2="450.4893" y1="185.0508" y2="185.0508"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="298.1777" x="116.1494" y="200.1523">RC-002 about O-002 &#183; R. Hightower &#183; 2026-11-03</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="278.9238" x="116.1494" y="216.2852">Marked: &#8220;to an approval recorded in section 15&#8221;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="257.4668" x="116.1494" y="232.418">Comment: Why days to approval, not hours?</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="98.4961" x="116.1494" y="248.5508">Status: answered</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="306.4336" x="116.1494" y="264.6836">Response: an approval waits on people, not the tool.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="88.0898" x="116.1494" y="280.8164">Changed: none</text><line style="stroke:#