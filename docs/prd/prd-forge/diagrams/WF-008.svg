0" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="273.0234" x="37.7666" y="113.4883">Changed: ST-003 now names its decision &lt;3&gt;</text><line style="stroke:#AAAAAA;stroke-width:1;" x1="37.7666" x2="328.1963" y1="120.5195" y2="120.5195"/><line style="stroke:#AAAAAA;stroke-width:1;" x1="37.7666" x2="328.1963" y1="122.5195" y2="122.5195"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="193.1074" x="37.7666" y="137.6211">88 and no blocking defects. &lt;4&gt;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="289.4297" x="37.7666" y="153.7539">Mark the section review? Review means it is ready</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="149.1504" x="37.7666" y="169.8867">for someone else to read.</text><rect fill="#EEEEEE" height="18.1328" rx="5" ry="5" style="stroke:#000000;stroke-width:2.5;" width="116" x="41.2666" y="177.918"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="86.4316" x="56.0508" y="191.5195">Mark as review</text><rect fill="#EEEEEE" height="18.1328" rx="5" ry="5" style="stroke:#000000;stroke-width:2.5;" width="60" x="164.2666" y="177.918"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="41.9648" x="173.2842" y="191.5195">Not yet</text><line style="stroke:#000000;stroke-width:1;" x1="36.7666" x2="328.1963" y1="42.4883" y2="42.4883"/><line style="stroke:#000000;stroke-width:1;" x1="36.7666" x2="328.1963" y1="200.5508" y2="200.5508"/><line style="stroke:#000000;stroke-width:1;" x1="36.7666" x2="36.7666" y1="42.4883" y2="58.6211"/><line style="stroke:#000000;stroke-width:1;" x1="328.1963" x2="328.1963" y1="42.4883" y2="58.6211"/><line style="stroke:#000000;stroke-width:1;" x1="36.7666" x2="36.7666" y1="173.418" y2="200.5508"/><line style="stroke:#000000;stroke-width:1;" x1="328