<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="SALT" height="301px" preserveAspectRatio="none" style="width:312px;height:301px;background:#FFFFFF;" version="1.1" viewBox="0 0 312 301" width="312px" zoomAndPan="magnify"><title>WF-005 The buildability review</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="227.8008" x="40.9375" y="28.5352">WF-005 The buildability review</text></g><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="257.5488" x="8" y="55.0898">What a team could not build from this set</text><line style="stroke:#000000;stroke-width:1;" x1="6" x2="6" y1="43.4883" y2="57.6211"/><line style="stroke:#000000;stroke-width:1;" x1="6" x2="268.5488" y1="43.4883" y2="43.4883"/><line style="stroke:#000000;stroke-width:1;" x1="268.5488" x2="268.5488" y1="43.4883" y2="57.6211"/><line style="stroke:#000000;stroke-width:1;" x1="268.5488" x2="278.5488" y1="57.6211" y2="57.6211"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="199.248" x="6" y="71.2227">prd-forge PRD, version 0.2.0 &lt;1&gt;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="214.1367" x="6" y="87.3555">9 of 11 derivability checks pass &lt;2&gt;</text><line style="stroke:#AAAAAA;stroke-width:1;" x1="6" x2="305.6758" y1="94.3867" y2="94.3867"/><line style="stroke:#AAAAAA;stroke-width:1;" x1="6" x2="305.6758" y1="96.3867" y2="96.3867"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="125.7715" x="6" y="111.4883">CANNOT BUILD &lt;3&gt;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="298.6758" x="6" y="127.6211">1. O-001 to O-003 have no baseline, so no feature</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="280.9395" x="6" y="143.7539">can carry a measure. "unknown - not measured;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="101.0566" x="6" y="159.8867">see Q-001." &lt;4&gt;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="12" x="6" y="176.0195">&#8230;</text><line style="stroke:#AAAAAA;stroke-width:1;" x1="6" x2="305.6758" y1="183.0508" y2="183.0508"/><line style="stroke:#AAAAAA;stroke-width:1;" x1="6" x2="305.6758" y1="185.0508" y2="185.0508"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="179.3965" x="6" y="200.1523">BACKLOG DERIVABILITY &lt;5&gt;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="9.1699" x="7" y="217.2852">&#10003;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="7.5879" x="21" y="217.2852">1</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="233.1797" x="30.5879" y="217.2852">One journey is the golden thread: J-001</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="6.8496" x="7" y="233.418">&#10007;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="7.5879" x="21" y="233.418">7</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="227.6953" x="30.5879" y="233.418">Objectives have a baseline and a target</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="12" x="7" y="249.5508">&#8230;</text><line style="stroke:#AAAAAA;stroke-width:1;" x1="6" x2="305.6758" y1="257.582" y2="257.582"/><line style="