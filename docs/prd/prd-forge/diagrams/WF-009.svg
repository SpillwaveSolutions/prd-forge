<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="SALT" height="180px" preserveAspectRatio="none" style="width:358px;height:180px;background:#FFFFFF;" version="1.1" viewBox="0 0 358 180" width="358px" zoomAndPan="magnify"><title>WF-009 A buildability review that finds gaps</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="325.0693" x="15" y="28.5352">WF-009 A buildability review that finds gaps</text></g><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="257.5488" x="20.8237" y="55.0898">What a team could not build from this set</text><line style="stroke:#000000;stroke-width:1;" x1="18.8237" x2="18.8237" y1="43.4883" y2="57.6211"/><line style="stroke:#000000;stroke-width:1;" x1="18.8237" x2="281.3726" y1="43.4883" y2="43.4883"/><line style="stroke:#000000;stroke-width:1;" x1="281.3726" x2="281.3726" y1="43.4883" y2="57.6211"/><line style="stroke:#000000;stroke-width:1;" x1="281.3726" x2="291.3726" y1="57.6211" y2="57.6211"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="147.457" x="18.8237" y="71.2227">Buildable with gaps. &lt;1&gt;</text><line style="stroke:#AAAAAA;stroke-width:1;" x1="18.8237" x2="338.2456" y1="78.2539" y2="78.2539"/><line style="stroke:#AAAAAA;stroke-width:1;" x1="18.8237" x2="338.2456" y1="80.2539" y2="80.2539"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="54.4043" x="19.8237" y="96.3555">&#10007; ST-004</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="153.6152" x="76.228" y="96.3555">no must requirement &lt;2&gt;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="54.4043" x="19.8237" y="112.4883">&#10007; ST-005</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="123.1523" x="76.228" y="112.4883">no must requirement</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="210.7793" x="18.8237" y="129.6211">&#10003; ST-001, ST-002, ST-003, ST-006</text><line style="stroke:#AAAAAA;stroke-width:1;" x1="18.8237" x2="338.2456" y1="136.6523" y2="136.6523"/><line style="stroke:#AAAAAA;stroke-width:1;" x1="18.8237" x2="338.2456" y1="138.6523" y2="138.6523"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="318.4219" x="18.8237" y="153.7539">Each gap becomes a requirement, or an open question</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="181.1309" x="18.8237" y="169.8867">with a decider and a date. &lt;3&gt;</text><line style="stroke:#000000;stroke-width:1;" x1="17.8237" x2="338.2456" y1="42.4883" y2="42.4883"/><line style="stroke:#000000;stroke-width:1;" x1="17.8237" x2="338.2456" y1="173.418" y2="173.418"/><line style="stroke:#000000;stroke-width:1;" x1="17.8237" x2="17.8237" y1="42.4883" y2="58.6211"/><line style="stroke:#000000;stroke-width:1;" x1="338.2456" x2="338.2456" y1="42.4883" y2="58.6211"/><line style="stroke:#000000;stroke-width:1;" x1="17.8237" x2="17.8237" y1="157.2852" y2="173.418"/><line style="stroke:#000000;stroke-width:1;" x1="338.2456" x2="338.2456" y1="157.2852" y2="173.418"/><line style="stroke:#000000;stroke-width:1;" x1="17.8237" x2="17.8237" y1="133.1523" y2="141.1523"/><line style="stroke:#000000;stroke-width:1;" x1="338.2456" x2="338.2456" y1="133.1523" y2="141.1523"/><line style="stroke:#000000;stroke-width:1;" x1="17.8237" x2="17.8237" y1="82.7539" y2="117.0195"/><line style="stroke:#000000;stroke-width:1;" x1="338.2456" x2="338.2456" y1="82.7539" y2="117.0195"/><line style="stroke:#000000;stroke-width:1;" x1="17.8237" x2="17.8237"