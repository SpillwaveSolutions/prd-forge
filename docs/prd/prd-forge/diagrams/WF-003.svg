<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="SALT" height="317px" preserveAspectRatio="none" style="width:325px;height:317px;background:#FFFFFF;" version="1.1" viewBox="0 0 325 317" width="325px" zoomAndPan="magnify"><title>WF-003 Why a section got its grade</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="258.501" x="32.0503" y="28.5352">WF-003 Why a section got its grade</text></g><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="170.7715" x="8" y="55.0898">Wireframes: graded 69/100</text><line style="stroke:#000000;stroke-width:1;" x1="6" x2="6" y1="43.4883" y2="57.6211"/><line style="stroke:#000000;stroke-width:1;" x1="6" x2="181.7715" y1="43.4883" y2="43.4883"/><line style="stroke:#000000;stroke-width:1;" x1="181.7715" x2="181.7715" y1="43.4883" y2="57.6211"/><line style="stroke:#000000;stroke-width:1;" x1="181.7715" x2="191.7715" y1="57.6211" y2="57.6211"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="261.0176" x="6" y="71.2227">1 blocking defect. Not ready for review. &lt;1&gt;</text><line style="stroke:#AAAAAA;stroke-width:1;" x1="6" x2="318.6016" y1="78.2539" y2="78.2539"/><line style="stroke:#AAAAAA;stroke-width:1;" x1="6" x2="318.6016" y1="80.2539" y2="80.2539"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="79.7637" x="6" y="95.3555">Blocking &lt;2&gt;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="288.0645" x="6" y="111.4883">&#8226; WF-002 names a part of the product and where</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="231.1816" x="6" y="127.6211">files are kept. In WF-002, lines 3 and 4.</text><line style="stroke:#AAAAAA;stroke-width:1;" x1="6" x2="318.6016" y1="134.6523" y2="134.6523"/><line style="stroke:#AAAAAA;stroke-width:1;" x1="6" x2="318.6016" y1="136.6523" y2="136.6523"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="185.4551" x="6" y="151.7539">Weakest: no design, 1 of 4 &lt;3&gt;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="311.6016" x="6" y="167.8867">WF-002 names a part of the product, which section 7</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="152.7891" x="6" y="184.0195">keeps out of every sketch.</text><line style="stroke:#AAAAAA;stroke-width:1;" x1="6" x2="318.6016" y1="191.0508" y2="191.0508"/><line style="stroke:#AAAAAA;stroke-width:1;" x1="6" x2="318.6016" y1="193.0508" y2="193.0508"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="62.1973" x="7" y="209.1523">Dimension</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="62.0391" x="131.5547" y="209.1523">Score &lt;4&gt;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="95.6484" x="7" y="225.2852">Marks explained</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="7.5879" x="131.5547" y="225.2852">4</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="122.5547" x="7" y="241.418">Every control earns...</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="7.5879" x="131.5547" y="241.418">4</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="103.875" x="7" y="257.5508">The person's view</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="7.5879" x="131.5547" y="257.5508">2</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="244.3945" x="6" y="274.6836">WF-001 shows ST-003 content at ST-001</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="12" x="6" y="290.8164">&#8230;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="186.7441" x="6" y="306.9492">&#8250; The rubric for wireframes &lt;5&gt;</text><line style="stroke:#000000;stroke-width:1;" x1="5" x2="318.6016" y1="42.4883" y2="42.4883"/><line style="stroke:#000000;stroke-width:1;" x1="5" x2="318.6016" y1="310.4805" y2="310.4805"/><line style="stroke:#000000;stroke-width:1;" x1="5" x2="5" y1="42.4883" y2="58.6211"/><line style="stroke:#000000;stroke-width:1;" x1="318.6016" x2="318.6016" y1="42.4883" y2="58.6211"/><line style="stroke:#000000;stroke-width:1;" x1="5" x2="5" y1="195.5508" y2="262.082"/><line style="stroke:#000000;stroke-width:1;" x1="318.6016" x2="318.6016" y1="195.5508" y2="262.082"/><line style="stroke:#000000;stroke-width:1;" x1="5" x2="5" y1="139.1523" y2="155.2852"/><line style="stroke:#000000;stroke-width:1;" x1="318.6016" x2="318.6016" y1="139.1523" y2="155.2852"/><line style="stroke:#000000;stroke-width:1;" x1="5" x2="5" y1="82.7539" y2="98.8867"/><line style="stroke:#000000;stroke-width:1;" x1="318.6016" x2="318.6016" y1="82.7539" y2="98.8867"/><line style="stroke:#000000;stroke-width:1;" x1="5" x2="5" y1="294.3477" y2="310.4805"/><line style="stroke:#000000;stroke-width:1;" x1="318.6016" x2="318.6016" y1="294.3477" y2="310.4805"/><line style="stroke:#000000;stroke-width:1;" x1="5" x2="5" y1="187.5508" y2="195.5508"/><line style="stroke:#000000;stroke-width:1;" x1="318.6016" x2="318.6016" y1="187.5508" y2="195.5508"/><line style="stroke:#000000;stroke-width:1;" x1="5" x2="5" y1="131.1523" y2="139.1523"/><line style="stroke:#000000;stroke-width:1;" x1="318.6016